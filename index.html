<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kállita Prado | Design de Posts para Instagram</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root{
      /* Paleta (baseada na sua referência) */
      --accent: #C1121F;     /* vermelho queimado */
      --accent2:#8A0F16;     /* vermelho profundo */
      --accentSoft:#D65A3A;  /* terracota/laranja fechado */

      --bg: #0B1510;         /* verde bem escuro */
      --bg2:#102018;         /* verde escuro */
      --card:#16271E;        /* verde card */

      --text:#F2E8CF;        /* off-white quente */
      --muted:#D6C7A8;       /* texto secundário */
      --white:#FFF6E6;       /* branco */

      --border:#2B3B31;

      --shadowSoft: 0 10px 30px rgba(0,0,0,0.35);
      --shadowStrong: 0 18px 50px rgba(0,0,0,0.55);

      --radius:16px;
      --radius2:22px;

      --max:1120px;
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      font-family:'Montserrat',sans-serif;
      background: radial-gradient(1200px 700px at 15% 10%, rgba(193,18,31,0.10), transparent 55%),
                  radial-gradient(900px 600px at 85% 15%, rgba(214,90,58,0.08), transparent 55%),
                  radial-gradient(900px 700px at 60% 80%, rgba(214,199,168,0.06), transparent 60%),
                  var(--bg);
      color: var(--text);
      line-height:1.6;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,246,230,0.03) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 30%, rgba(255,246,230,0.02) 0 1px, transparent 2px),
        radial-gradient(circle at 40% 80%, rgba(255,246,230,0.02) 0 1px, transparent 2px);
      background-size: 240px 240px, 280px 280px, 320px 320px;
      opacity: .8;
      z-index:0;
    }

    a{color:inherit;}
    .wrap{position:relative; z-index:1;}

    .container{
      max-width: var(--max);
      margin: 0 auto;
      padding: 84px 22px;
    }

    /* Topbar (não fixa) */
    .topbar{
      max-width: var(--max);
      margin: 22px auto 0 auto;
      padding: 14px 18px;
      border: 1px solid rgba(43,59,49,0.7);
      border-radius: 999px;
      background: rgba(16,32,24,0.65);
      backdrop-filter: blur(10px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      letter-spacing:0.2px;
      color: var(--white);
    }
    .brand .dot{
      width:10px;height:10px;border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accentSoft));
      box-shadow: 0 0 0 6px rgba(193,18,31,0.12);
    }
    .nav{
      display:flex;
      gap:16px;
      flex-wrap:wrap;
      align-items:center;
      font-size:0.95rem;
      color: var(--muted);
    }
    .nav a{
      text-decoration:none;
      padding:8px 12px;
      border-radius:999px;
      transition: all .25s ease;
    }
    .nav a:hover{
      color: var(--white);
      background: rgba(193,18,31,0.12);
    }

    /* Hero */
    .hero{
      padding-top: 38px;
      padding-bottom: 30px;
    }
    .hero-grid{
      display:grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 38px;
      align-items: center;
    }

    .kicker{
      display:inline-flex;
      gap:10px;
      align-items:center;
      padding:10px 14px;
      border: 1px solid rgba(43,59,49,0.8);
      background: rgba(22,39,30,0.55);
      border-radius: 999px;
      color: var(--muted);
      font-weight:600;
      font-size:0.95rem;
      margin-bottom: 18px;
    }
    .kicker i{color: var(--accentSoft);}

    h1{
      font-size: 3.05rem;
      line-height: 1.12;
      letter-spacing: -1.2px;
      margin-bottom: 16px;
      color: var(--white);
      background: linear-gradient(92deg, #FFF6E6 0%, #F2E8CF 28%, #C1121F 62%, #D65A3A 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 220% auto;
      animation: shine 3.2s linear infinite;
    }
    @keyframes shine{to{background-position: 220% center;}}

    .hero p{
      color: var(--muted);
      font-size: 1.08rem;
      margin-bottom: 14px;
      max-width: 60ch;
    }

    .hero-cta{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top: 20px;
      align-items:center;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 16px 18px;
      border-radius: 14px;
      text-decoration:none;
      font-weight: 800;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
      border: 1px solid rgba(43,59,49,0.9);
      cursor:pointer;
      min-width: 220px;
    }
    .btn-primary{
      color: #fff;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-color: rgba(193,18,31,0.5);
      box-shadow: 0 18px 45px rgba(193,18,31,0.25);
    }
    .btn-primary:hover{
      transform: translateY(-2px);
      box-shadow: 0 22px 55px rgba(193,18,31,0.32);
    }
    .btn-ghost{
      color: var(--white);
      background: rgba(16,32,24,0.5);
    }
    .btn-ghost:hover{
      transform: translateY(-2px);
      border-color: rgba(193,18,31,0.45);
      box-shadow: var(--shadowSoft);
    }

    .hero-card{
      background: linear-gradient(180deg, rgba(22,39,30,0.82), rgba(16,32,24,0.65));
      border: 1px solid rgba(43,59,49,0.85);
      border-radius: var(--radius2);
      box-shadow: var(--shadowStrong);
      padding: 22px;
      position:relative;
      overflow:hidden;
    }
    .hero-card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(600px 260px at 30% 0%, rgba(193,18,31,0.22), transparent 50%),
                  radial-gradient(500px 240px at 80% 35%, rgba(214,90,58,0.14), transparent 55%);
      opacity: 1;
      pointer-events:none;
    }
    .hero-card-inner{position:relative; z-index:1;}
    .mini-title{
      font-weight:900;
      color: var(--white);
      letter-spacing: -0.3px;
      font-size:1.05rem;
      margin-bottom: 12px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .mini-title .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(193,18,31,0.14);
      border: 1px solid rgba(193,18,31,0.35);
      color: var(--white);
      font-weight:800;
      font-size: 0.9rem;
    }

    .checklist{
      margin-top: 10px;
      display:grid;
      gap: 10px;
    }
    .check{
      display:flex;
      gap:10px;
      align-items:flex-start;
      color: var(--muted);
      font-weight:500;
    }
    .check i{
      margin-top: 2px;
      color: var(--accentSoft);
    }

    .limit{
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(214,199,168,0.06);
      border: 1px solid rgba(214,199,168,0.18);
      color: var(--muted);
      font-size: 0.98rem;
    }
    .limit strong{color: var(--white);}

    /* section titles */
    .section-title{
      text-align:center;
      margin-bottom: 42px;
    }
    .section-title h2{
      font-size: 2.2rem;
      letter-spacing: -0.6px;
      color: var(--white);
      margin-bottom: 10px;
    }
    .section-title p{
      max-width: 76ch;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .divider{
      width: 110px;
      height: 4px;
      margin: 16px auto 0 auto;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(193,18,31,0), rgba(193,18,31,1), rgba(214,90,58,0.9), rgba(193,18,31,0));
    }

    /* sections bg */
    .section{
      background: linear-gradient(180deg, rgba(16,32,24,0.45), rgba(16,32,24,0.18));
      border-top: 1px solid rgba(43,59,49,0.5);
      border-bottom: 1px solid rgba(43,59,49,0.5);
    }

    /* grids */
    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      align-items: stretch;
      margin-top: 28px;
    }
    .grid2{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 22px;
      margin-top: 28px;
    }
    .grid3{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
      margin-top: 28px;
    }

    /* cards */
    .card{
      background: rgba(22,39,30,0.78);
      border: 1px solid rgba(43,59,49,0.9);
      border-radius: var(--radius2);
      box-shadow: var(--shadowSoft);
      padding: 26px;
      position:relative;
      overflow:hidden;
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }
    .card:hover{
      transform: translateY(-4px);
      border-color: rgba(193,18,31,0.45);
      box-shadow: var(--shadowStrong);
    }
    .card .topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(214,199,168,0.06);
      border: 1px solid rgba(214,199,168,0.18);
      color: var(--muted);
      font-weight:700;
      font-size:0.92rem;
    }
    .pill i{color: var(--accentSoft);}

    .card h3{
      font-size: 1.55rem;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
      color: var(--white);
    }
    .card p{
      color: var(--muted);
      margin-bottom: 14px;
    }

    .list{
      margin-top: 10px;
      display:grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    .item{
      display:flex;
      gap: 10px;
      color: var(--text);
      font-weight: 500;
    }
    .item i{
      color: var(--accent);
      margin-top: 3px;
    }
    .item strong{color: var(--white); font-weight:800;}

    .price{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 10px;
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px solid rgba(43,59,49,0.75);
    }
    .amount{
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--accentSoft);
      letter-spacing: -0.8px;
    }
    .amount span{
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--muted);
    }
    .card .cta{
      margin-top: 16px;
      width: 100%;
      min-width: unset;
    }

    /* Featured plan */
    .featured{
      border-color: rgba(193,18,31,0.65);
      background: linear-gradient(180deg, rgba(22,39,30,0.82), rgba(22,39,30,0.65));
    }
    .featured::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(700px 300px at 20% 0%, rgba(193,18,31,0.22), transparent 55%),
                  radial-gradient(700px 300px at 90% 20%, rgba(214,90,58,0.16), transparent 55%);
      pointer-events:none;
    }
    .featured .card-inner{position:relative; z-index:1;}
    .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(193,18,31,0.22), rgba(214,90,58,0.14));
      border: 1px solid rgba(193,18,31,0.45);
      color: var(--white);
      font-weight: 900;
      font-size: 0.92rem;
    }

    /* Steps */
    .steps{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
      margin-top: 28px;
    }
    .step{
      background: rgba(22,39,30,0.70);
      border: 1px solid rgba(43,59,49,0.85);
      border-radius: var(--radius2);
      padding: 18px;
      box-shadow: var(--shadowSoft);
      transition: transform .2s ease, border-color .2s ease;
    }
    .step:hover{
      transform: translateY(-3px);
      border-color: rgba(214,199,168,0.35);
    }
    .step .num{
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(193,18,31,0.14);
      border: 1px solid rgba(193,18,31,0.35);
      color: var(--white);
      font-weight: 900;
      margin-bottom: 12px;
    }
    .step h4{
      color: var(--white);
      font-size: 1.05rem;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }
    .step p{
      color: var(--muted);
      font-size: 0.98rem;
      margin-bottom: 0;
    }

    /* Testimonials */
    .testimonials{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 18px;
      margin-top: 28px;
    }
    .quote{
      background: rgba(22,39,30,0.72);
      border: 1px solid rgba(43,59,49,0.85);
      border-radius: var(--radius2);
      padding: 18px;
      box-shadow: var(--shadowSoft);
    }
    .quote p{
      color: var(--muted);
      font-style: italic;
      margin-bottom: 12px;
    }
    .quote .who{
      color: var(--white);
      font-weight: 800;
      display:flex;
      align-items:
